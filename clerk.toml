# superpowers-clerk project configuration (adoption design 2026-10-03, §3.1).
# Read by the clerk from the BASE commit of a review, never from the worktree under review.

project = "idraa"

[judge]
backend = "jev"
model = "jev-1.13.0"                  # pinned, same as scripts/curation_check/config.py; never the moving alias
keychain_service = "jev-eval-typesafe-key"   # macOS Keychain item the curation checker also accepts
# "per-run": the judge leaves the machine only on a run given --external (clerk 0.1.1, superpowers-clerk#2),
# which replaces the 0.1.0 `true` that sent every run. A public, non-embargoed run passes --external after the
# push-target check; plan-gates and embargoed work (sec/ghsa/advisory branches, GHSA ids) pass --no-external
# (CLAUDE.md, Review ceremony).
allow_external_judge = "per-run"

[trust]                               # the clerk's floors; Idraa does not tighten in P1
confidence = 0.95
min_actionable = 19

[escalation]
# BLOCKER-class subjects: always escalated to the reviewer. Three engine subjects (CLAUDE.md,
# Review ceremony), ten threat-model boundary subjects, and gate-integrity for the merge
# authority itself. Three coverage rules (tests/scripts/test_clerk_config.py): every line-cited
# tracked file in docs/security/threat-model.md, every security-lane file and every
# methodology-lane file must match a path below. Five lane-membership rules in the same file
# (lane completeness audits, #217/#218/#243) keep the lanes complete: files named by the departures
# register (M-A), importing numeric packages (M-B), calling Math.exp/log/pow/sqrt in shipped
# JavaScript (M-B-JS) or recording a methodology finding in their text (M-C) must be in the
# methodology lane; files whose syntax tree shows a security signal (S-A) must be in the security
# lane; each such file is tagged below or listed in .clerk/manifests/lane_exemptions.json.
subjects = [
  "fair-math", "calibration", "derivation",
  "auth", "csrf", "org-scoping", "migration", "import-export", "templating", "rbac",
  "run-limits", "audit", "secrets", "gate-integrity",
]

