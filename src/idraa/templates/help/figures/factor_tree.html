{#- src/idraa/templates/help/figures/factor_tree.html — static first-party
    SVG figure (Task 6). Colors are literal graphite tokens, not CSS vars
    (PRSC-N1): fill=/stroke= are SVG PRESENTATION ATTRIBUTES, which cannot
    take var(--color-…) — only CSS properties set via a <style> block or
    external sheet can reference a custom property. #37464F = graphite
    strokes + primary labels (matches pdf_theme/chart palette), #52525B =
    secondary labels. No script tags, no on*= handlers, no Jinja
    expressions inside this figure — enforced by help_content.py's
    import-time figure guard (Sec2-I3/Sec3-N2b). -#}
<figure class="help-figure" data-figure="factor-tree">
  <svg viewBox="0 0 640 260" role="img" aria-labelledby="fig-factor-tree-title" xmlns="http://www.w3.org/2000/svg">
    <title id="fig-factor-tree-title">The FAIR factor tree as Idraa models it</title>

    <!-- connectors: leaves -> LEF -->
    <path d="M170,40 H215 V70" fill="none" stroke="#37464F" stroke-width="1.5" />
    <path d="M170,100 H215 V70" fill="none" stroke="#37464F" stroke-width="1.5" />
    <path d="M215,70 H260" fill="none" stroke="#37464F" stroke-width="1.5" />

    <!-- connectors: leaves -> LM -->
    <path d="M170,160 H215 V190" fill="none" stroke="#37464F" stroke-width="1.5" />
    <path d="M170,220 H215 V190" fill="none" stroke="#37464F" stroke-width="1.5" />
    <path d="M215,190 H260" fill="none" stroke="#37464F" stroke-width="1.5" />

    <!-- connectors: LEF, LM -> Risk -->
    <path d="M410,70 H445 V130" fill="none" stroke="#37464F" stroke-width="1.5" />
    <path d="M410,190 H445 V130" fill="none" stroke="#37464F" stroke-width="1.5" />
    <path d="M445,130 H480" fill="none" stroke="#37464F" stroke-width="1.5" />

    <!-- operator badges: TEF x Vulnerability = LEF; Primary + Secondary = LM; LEF x LM = Risk -->
    <circle cx="215" cy="70" r="10" fill="#FFFFFF" stroke="#37464F" stroke-width="1.5" />
    <text x="215" y="75" text-anchor="middle" font-size="13" fill="#37464F">&#215;</text>

    <circle cx="215" cy="190" r="10" fill="#FFFFFF" stroke="#37464F" stroke-width="1.5" />
    <text x="215" y="195" text-anchor="middle" font-size="13" fill="#37464F">+</text>

    <circle cx="445" cy="130" r="10" fill="#FFFFFF" stroke="#37464F" stroke-width="1.5" />
    <text x="445" y="135" text-anchor="middle" font-size="13" fill="#37464F">&#215;</text>

    <!-- leaf nodes -->
    <rect x="20" y="15" width="150" height="50" rx="6" fill="#F4F4F5" stroke="#37464F" stroke-width="1.5" />
    <text x="95" y="36" text-anchor="middle" font-size="13" font-weight="600" fill="#37464F">TEF</text>
    <text x="95" y="50" text-anchor="middle" font-size="9" fill="#52525B">Threat Event Frequency</text>

    <rect x="20" y="75" width="150" height="50" rx="6" fill="#F4F4F5" stroke="#37464F" stroke-width="1.5" />
    <text x="95" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#37464F">Vulnerability</text>

    <rect x="20" y="135" width="150" height="50" rx="6" fill="#F4F4F5" stroke="#37464F" stroke-width="1.5" />
    <text x="95" y="165" text-anchor="middle" font-size="13" font-weight="600" fill="#37464F">Primary loss</text>

    <rect x="20" y="195" width="150" height="50" rx="6" fill="#F4F4F5" stroke="#37464F" stroke-width="1.5" />
    <text x="95" y="225" text-anchor="middle" font-size="13" font-weight="600" fill="#37464F">Secondary loss</text>

    <!-- mid nodes -->
    <rect x="260" y="45" width="150" height="50" rx="6" fill="#EAEAEC" stroke="#37464F" stroke-width="1.5" />
    <text x="335" y="66" text-anchor="middle" font-size="14" font-weight="700" fill="#37464F">LEF</text>
    <text x="335" y="80" text-anchor="middle" font-size="9" fill="#52525B">Loss Event Frequency</text>

    <rect x="260" y="165" width="150" height="50" rx="6" fill="#EAEAEC" stroke="#37464F" stroke-width="1.5" />
    <text x="335" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#37464F">LM</text>
    <text x="335" y="200" text-anchor="middle" font-size="9" fill="#52525B">Loss Magnitude</text>

    <!-- root node -->
    <rect x="480" y="100" width="140" height="60" rx="8" fill="#37464F" stroke="#37464F" stroke-width="1.5" />
    <text x="550" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Risk</text>
  </svg>
  <figcaption>The FAIR factor tree as Idraa models it — every loss number on a run page traces back to these nodes.</figcaption>
</figure>
